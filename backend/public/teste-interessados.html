<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Teste - Cadastro de Interessados</title>
</head>
<body>
  <h2>Teste de cadastro</h2>
  <form id="formInteressado">
    <input type="email" id="email" placeholder="E-mail" required><br><br>
    <input type="text" id="nome" placeholder="Nome" required><br><br>
    <button type="submit">Cadastrar</button>
  </form>

  <script>
    document.getElementById('formInteressado').addEventListener('submit', async (evento) => {
      evento.preventDefault();

      const email = document.getElementById('email').value;
      const nome = document.getElementById('nome').value;

      const resposta = await fetch('http://localhost:3000/api/interessados', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, nome }),
      });

      const dados = await resposta.json();

      if (!resposta.ok) {
        alert(dados.erro);
      } else {
        alert('Cadastro realizado com sucesso!');
      }
    });
  </script>
</body>
</html>
